[project]
name = "discord-rich-presence-plex"
version = "2.16.0"
description = "Discord Rich Presence integration for Plex"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "discord-rich-presence-plex contributors" }]
requires-python = ">=3.9"
dependencies = [
  "PlexAPI==4.17.1",
  "requests==2.32.5",
  "websocket-client==1.8.0",
  "PyYAML==6.0.2",
  "pillow==11.3.0",
  "pip>=25.3",
]


[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.hatch.build.targets.sdist]
include = [
  "src/app/**",
  "README.md",
  "LICENSE",
  "COPYRIGHT",
  "NOTICE",
]

[project.scripts]
discord-rich-presence-plex = "app.cli:cli"
